<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="bingbot" content="noindex, nofollow" />
  <meta name="yandex" content="none" />
  <title>بيانات العنوان</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap");

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --ink: #202635;
      --line: #ececf2;
      --brand: #fd1107;
      --brand-dark: #b90f0c;
      --shadow: 0 18px 40px rgba(45, 49, 66, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Readex Pro", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #845f67 0 14px, var(--bg) 14px 100%);
      color: var(--ink);
    }

    .shell {
      min-height: 100vh;
      width: min(100%, 620px);
      margin: 0 auto;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 18px 16px 28px;
    }

    .search {
      margin: 26px 0 20px;
      height: 56px;
      border-radius: 999px;
      background: #f2f3f7;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      color: #9ba1ad;
      font-size: clamp(16px, 3vw, 22px);
    }

    .search-icon {
      font-size: 26px;
      line-height: 1;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding: 6px 8px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tool-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      font-size: 22px;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #c81919;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 10px;
      border: 2px solid #fff;
    }

    .avatar,
    .hamburger {
      font-size: 36px;
      line-height: 1;
    }

    .form-card {
      padding: 4px 8px 18px;
    }

    .field {
      margin: 16px 0;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: clamp(16px, 2.6vw, 20px);
      font-weight: 600;
    }

    .required {
      color: #ff3347;
      margin-right: 6px;
    }

    .control,
    .select-wrap select {
      width: 100%;
      height: 60px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0 18px;
      font-size: clamp(15px, 2.5vw, 18px);
      color: var(--ink);
      outline: none;
      box-shadow: 0 2px 12px rgba(33, 38, 55, 0.03) inset;
    }

    .control::placeholder,
    .select-wrap select {
      color: #b8bcc6;
    }

    .control:focus,
    .select-wrap select:focus {
      border-color: #aaf6ee;
      box-shadow: 0 0 0 3px rgba(170, 246, 238, 0.22);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #9fa4b1;
      font-size: 24px;
      pointer-events: none;
    }

    .select-wrap select {
      appearance: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      height: 62px;
      border: 0;
      border-radius: 16px;
      font-size: clamp(15px, 2.4vw, 18px);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
    }

    .btn-apple {
      background: #050505;
      color: #fff;
    }

    .btn-primary,
    .btn-cart {
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #fff;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .shell {
        padding: 16px 14px 24px;
      }

      .search {
        height: 52px;
        margin-top: 24px;
        font-size: 16px;
      }

      .tool-circle {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .avatar,
      .hamburger {
        font-size: 30px;
      }

      .control,
      .select-wrap select,
      .btn {
        height: 56px;
      }

      .actions {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="search">
      <span class="search-icon">⌕</span>
      <span>ادخل كلمة البحث</span>
    </div>

    <section class="toolbar">
      <div class="toolbar-right">
        <div class="hamburger">☰</div>
      </div>
      <div class="toolbar-left">
        <div class="avatar">👤</div>
        <div class="tool-circle">
          👜
          <span class="badge">•</span>
        </div>
        <div style="font-size: 34px;">⌗</div>
      </div>
    </section>

    <form class="form-card" action="billing.html">
      <div class="field">
        <label class="label" for="first_name"><span class="required">*</span>الاسم الأول</label>
        <input class="control" id="first_name" name="first_name" type="text" placeholder="ادخل الاسم الأول" />
      </div>

      <div class="field">
        <label class="label" for="last_name"><span class="required">*</span>اسم الأخير</label>
        <input class="control" id="last_name" name="last_name" type="text" placeholder="ادخل اسم الأخير" />
      </div>

      <div class="field">
        <label class="label" for="phone"><span class="required">*</span>رقم الجوال</label>
        <input class="control" id="phone" name="phone" type="tel" placeholder="05xxxxxxxx" />
      </div>

      <div class="field">
        <label class="label" for="country">اختر الدولة</label>
        <div class="select-wrap">
          <select id="country" name="country">
            <option selected>المملكة العربية السعودية</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label" for="city"><span class="required">*</span>اختر المدينة</label>
        <div class="select-wrap">
          <select id="city" name="city">
            <option selected>اختر المدينة</option>
            <option>أبها</option>
            <option>أبو عريش</option>
            <option>الأحساء</option>
            <option>الأفلاج</option>
            <option>الباحة</option>
            <option>البكيرية</option>
            <option>الجبيل</option>
            <option>الجموم</option>
            <option>الخرج</option>
            <option>الخفجي</option>
            <option>الخبر</option>
            <option>الدرعية</option>
            <option>الدرب</option>
            <option>الدمام</option>
            <option>الدوادمي</option>
            <option>الرس</option>
            <option>الرياض</option>
            <option>الزلفي</option>
            <option>السليل</option>
            <option>الطائف</option>
            <option>العلا</option>
            <option>القريات</option>
            <option>القصيم</option>
            <option>القنفذة</option>
            <option>المدينة المنورة</option>
            <option>المجمعة</option>
            <option>المخواة</option>
            <option>المذنب</option>
            <option>المهد</option>
            <option>النماص</option>
            <option>الهفوف</option>
            <option>الوجه</option>
            <option>املج</option>
            <option>بارق</option>
            <option>بدر</option>
            <option>بريدة</option>
            <option>بيشة</option>
            <option>تبوك</option>
            <option>تربة</option>
            <option>تثليث</option>
            <option>تنومة</option>
            <option>جازان</option>
            <option>جدة</option>
            <option>حائل</option>
            <option>حفر الباطن</option>
            <option>حقل</option>
            <option>حوطة بني تميم</option>
            <option>خليص</option>
            <option>خميس مشيط</option>
            <option>دومة الجندل</option>
            <option>رابغ</option>
            <option>راس تنورة</option>
            <option>رفحاء</option>
            <option>رنية</option>
            <option>صبيا</option>
            <option>صفوى</option>
            <option>ضباء</option>
            <option>طبرجل</option>
            <option>طريف</option>
            <option>عرعر</option>
            <option>عفيف</option>
            <option>عنيزة</option>
            <option>ينبع</option>
            <option>ينبع الصناعية</option>
            <option>نجران</option>
            <option>وادي الدواسر</option>
            <option>شرورة</option>
            <option>ظهران الجنوب</option>
            <option>محايل عسير</option>
            <option>رجال ألمع</option>
            <option>سكاكا</option>
            <option>ساجر</option>
            <option>سيهات</option>
            <option>رأس الخير</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label" for="district"><span class="required">*</span>الحي</label>
        <input class="control" id="district" name="district" type="text" placeholder="الحي" />
      </div>

      <div class="field">
        <label class="label" for="street"><span class="required">*</span>الشارع</label>
        <input class="control" id="street" name="street" type="text" placeholder="ادخل اسم الشارع" />
      </div>

      <div class="field">
        <label class="label" for="house">وصف البيت</label>
        <input class="control" id="house" name="house" type="text" placeholder="اكتب وصفًا للبيت" />
      </div>

      <div class="actions">
        <button class="btn btn-apple" type="submit"> Pay</button>
        <button class="btn btn-primary" type="submit">اشتري الآن 🛍</button>
        <button class="btn btn-cart" type="submit">🛒</button>
      </div>
    </form>
  </main>
</body>
</html>
